name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Compilar y probar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar paquetes
        run: dotnet restore tests/AsistenciaQR.Tests/AsistenciaQR.Tests.csproj

      - name: Compilar
        run: dotnet build tests/AsistenciaQR.Tests/AsistenciaQR.Tests.csproj -c Release --no-restore

      - name: Pruebas unitarias
        run: dotnet test tests/AsistenciaQR.Tests/AsistenciaQR.Tests.csproj -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: tests/AsistenciaQR.Tests/TestResults/*.trx

  release:
    name: Publicar version
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version desde el tag (v2.0.0 -> 2.0.0)
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publicar ejecutable (no necesita instalar .NET)
        run: dotnet publish src/AsistenciaQR/AsistenciaQR.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publicar

      - name: Compilar instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ env.VERSION }} /DOrigen=..\publicar installer\AsistenciaQR.iss

      - name: Empaquetar zip portable
        shell: pwsh
        run: |
          Copy-Item database -Destination publicar/database -Recurse
          Compress-Archive -Path publicar/* -DestinationPath "AsistenciaQR-${{ github.ref_name }}-win-x64.zip"

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/AsistenciaQR-Setup-${{ env.VERSION }}.exe
            AsistenciaQR-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
